<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="jmita2288-debug developer profile">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#73f55b"/>
      <stop offset="1" stop-color="#a9ff7a"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#73f55b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#73f55b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#73f55b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="258" rx="24" fill="url(#panel)" stroke="#27313b" stroke-width="2"/>
  <rect x="0" y="0" width="7" height="260" rx="4" fill="url(#accent)"/>

  <text x="58" y="58" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="16" letter-spacing="3">DEVELOPER PROFILE</text>
  <text x="58" y="128" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="760">jmita2288-debug</text>
  <text x="58" y="171" fill="#a8b3bd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Desenvolvedor independente focado em produtos, streaming e experiência multiplataforma.</text>

  <text x="58" y="215" fill="#73f55b" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="16">mobile</text>
  <circle cx="127" cy="210" r="3" fill="#44515d"/>
  <text x="144" y="215" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="16">streaming</text>
  <circle cx="244" cy="210" r="3" fill="#44515d"/>
  <text x="261" y="215" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="16">web</text>
  <circle cx="308" cy="210" r="3" fill="#44515d"/>
  <text x="325" y="215" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="16">automation</text>

  <g transform="translate(900 42)">
    <rect width="240" height="172" rx="18" fill="#0a0f14" stroke="#202a33"/>
    <circle cx="30" cy="31" r="5" fill="#73f55b"/>
    <text x="48" y="37" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14">currently building</text>
    <text x="30" y="86" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">XTOYBOX</text>
    <text x="30" y="116" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Android · TV · iOS · Web</text>
    <path d="M30 142 H200" stroke="#26313a" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 142 H150" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="150" cy="142" r="4" fill="#8cff68" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="-220" y="247" width="220" height="3" rx="2" fill="url(#scan)" filter="url(#glow)">
    <animate attributeName="x" values="-220;1200" dur="5.5s" repeatCount="indefinite"/>
  </rect>
</svg>
