<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-label="XTOYBOX em desenvolvimento">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070a09"/>
      <stop offset="1" stop-color="#0b100d"/>
    </linearGradient>
    <linearGradient id="green" x1="78" y1="174" x2="211" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2fd318"/>
      <stop offset=".52" stop-color="#8af000"/>
      <stop offset="1" stop-color="#caff1a"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="card"><rect width="900" height="220" rx="28"/></clipPath>
  </defs>

  <rect width="900" height="220" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="218" rx="27" fill="none" stroke="#202821" stroke-width="2"/>

  <g clip-path="url(#card)">
    <rect x="-180" y="0" width="120" height="220" fill="#8af000" opacity="0.035" filter="url(#soft)">
      <animate attributeName="x" values="-180;960" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(38 34)">
    <rect width="152" height="152" rx="34" fill="#050807"/>
    <path d="M42 93c-13 0-24-10-24-23 0-12 9-22 21-23 6-16 21-27 39-27 22 0 40 15 44 35 10 2 18 10 18 21 0 12-10 22-23 22H42Z" fill="none" stroke="url(#green)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".96"/>
    <path d="M30 69h25M20 82h33M38 95h18" stroke="url(#green)" stroke-width="7" stroke-linecap="round" opacity=".9"/>
    <path d="M52 45h25l18 22 19-22h27L109 76l32 34h-27L95 87l-19 23H50l32-34-30-31Z" fill="url(#green)"/>
    <animateTransform attributeName="transform" additive="sum" type="scale" values="1;1.015;1" dur="2.8s" repeatCount="indefinite"/>
  </g>

  <text x="232" y="92" fill="#f2f6f3" font-size="48" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" letter-spacing="1">XTOYBOX</text>
  <text x="234" y="130" fill="#a4b1a8" font-size="19" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">Android  •  TV  •  iOS</text>
  <circle cx="240" cy="164" r="5" fill="#8af000">
    <animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="258" y="170" fill="#7e8c82" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">em desenvolvimento</text>
</svg>
