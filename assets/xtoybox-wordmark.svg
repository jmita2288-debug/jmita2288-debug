<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="XTOYBOX">
  <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#64ff4a"/><stop offset="1" stop-color="#b7ff69"/></linearGradient><linearGradient id="scan" x1="0" x2="1"><stop stop-color="#64ff4a" stop-opacity="0"/><stop offset=".5" stop-color="#64ff4a"/><stop offset="1" stop-color="#64ff4a" stop-opacity="0"/></linearGradient><filter id="glow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="900" height="210" rx="24" fill="#0b0f0d"/>
  <rect x="1" y="1" width="898" height="208" rx="23" fill="none" stroke="#26312b"/>
  <text x="50" y="58" fill="#6e7b72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="4">MAIN PROJECT / ACTIVE</text>
  <text x="50" y="120" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="900" letter-spacing="2">XTOYBOX</text>
  <text x="52" y="156" fill="#9ba7a0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="1.5">Streaming • Remote Play • Android • TV • iOS</text>
  <circle cx="826" cy="54" r="8" fill="#64ff4a" filter="url(#glow)"><animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="806" y="91" fill="#64ff4a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="2">ONLINE</text>
  <rect x="50" y="182" width="800" height="3" rx="2" fill="#172019"/>
  <rect x="-160" y="182" width="160" height="3" rx="2" fill="url(#scan)" filter="url(#glow)"><animate attributeName="x" values="-160;850" dur="4s" repeatCount="indefinite"/></rect>
</svg>
