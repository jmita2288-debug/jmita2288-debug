<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Linguagens mais presentes nos projetos principais">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10171e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <rect x="1" y="1" width="1198" height="328" rx="22" fill="url(#bg)" stroke="#27313b" stroke-width="2"/>
  <text x="42" y="50" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">Linguagens mais presentes</text>
  <text x="42" y="78" fill="#7d8590" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">ordem baseada no uso real dos repositórios principais analisados</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="16">
    <text x="42" y="126" fill="#c9d1d9">TypeScript</text>
    <rect x="178" y="108" width="850" height="20" rx="10" fill="#17202a"/>
    <rect x="178" y="108" width="0" height="20" rx="10" fill="#3178c6"><animate attributeName="width" from="0" to="850" dur="0.9s" fill="freeze"/></rect>

    <text x="42" y="170" fill="#c9d1d9">JavaScript</text>
    <rect x="178" y="152" width="850" height="20" rx="10" fill="#17202a"/>
    <rect x="178" y="152" width="0" height="20" rx="10" fill="#f1d84b"><animate attributeName="width" from="0" to="704" dur="1s" fill="freeze"/></rect>

    <text x="42" y="214" fill="#c9d1d9">Java</text>
    <rect x="178" y="196" width="850" height="20" rx="10" fill="#17202a"/>
    <rect x="178" y="196" width="0" height="20" rx="10" fill="#e76f3c"><animate attributeName="width" from="0" to="197" dur="1.1s" fill="freeze"/></rect>

    <text x="42" y="258" fill="#c9d1d9">GLSL</text>
    <rect x="178" y="240" width="850" height="20" rx="10" fill="#17202a"/>
    <rect x="178" y="240" width="0" height="20" rx="10" fill="#7e8b98"><animate attributeName="width" from="0" to="88" dur="1.2s" fill="freeze"/></rect>

    <text x="42" y="302" fill="#c9d1d9">Python</text>
    <rect x="178" y="284" width="850" height="20" rx="10" fill="#17202a"/>
    <rect x="178" y="284" width="0" height="20" rx="10" fill="#3776ab"><animate attributeName="width" from="0" to="53" dur="1.3s" fill="freeze"/></rect>
  </g>

  <g transform="translate(1060 103)">
    <circle cx="18" cy="18" r="18" fill="#141d25" stroke="#26323d"/>
    <circle cx="18" cy="18" r="5" fill="#73f55b"><animate attributeName="opacity" values="0.45;1;0.45" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <text x="1060" y="159" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12">GitHub</text>
  <text x="1060" y="177" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12">Linguist</text>
</svg>
